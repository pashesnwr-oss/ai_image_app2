  <!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Image App</title>

  <meta name="theme-color" content="#167c35">
  <meta name="description" content="دروستکردن و دەستکاریکردنی وێنە بە AI">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f2f3f5;
      font-family: Arial, Tahoma, sans-serif;
      color: #222;
    }

    .app {
      max-width: 650px;
      margin: auto;
    }

    .header {
      text-align: center;
      background: white;
      padding: 22px 15px;
      border-radius: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .header p {
      margin: 0;
      color: #666;
      font-size: 16px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .upload {
      border: 2px dashed #198754;
      border-radius: 18px;
      padding: 25px 15px;
      text-align: center;
      cursor: pointer;
      background: #f8fff9;
      transition: .2s;
    }

    .upload:hover {
      background: #edfff1;
    }

    .upload-icon {
      font-size: 45px;
      margin-bottom: 8px;
    }

    .upload-text {
      font-size: 18px;
      font-weight: bold;
    }

    .upload-small {
      color: #777;
      margin-top: 7px;
      font-size: 14px;
    }

    #imageInput {
      display: none;
    }

    #previewBox {
      display: none;
      margin-top: 15px;
      position: relative;
    }

    #previewImage {
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      border-radius: 15px;
      display: block;
    }

    .remove-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #dc3545;
      color: white;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      border: 1px solid #ccc;
      border-radius: 16px;
      padding: 15px;
      font-family: inherit;
      font-size: 18px;
      line-height: 1.7;
      outline: none;
    }

    textarea:focus {
      border-color: #198754;
      box-shadow: 0 0 0 3px rgba(25,135,84,.12);
    }

    .generate {
      width: 100%;
      border: none;
      border-radius: 17px;
      background: #198754;
      color: white;
      padding: 18px;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .generate:disabled {
      background: #777;
      cursor: not-allowed;
    }

    .clear {
      width: 100%;
      border: none;
      border-radius: 17px;
      background: #dc3545;
      color: white;
      padding: 16px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 12px;
    }

    #status {
      display: none;
      text-align: center;
      background: #fff;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 18px;
      font-size: 17px;
    }

    .loading {
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%,100% { opacity: .5; }
      50% { opacity: 1; }
    }

    #resultBox {
      display: none;
    }

    #resultImage {
      width: 100%;
      border-radius: 18px;
      display: block;
      background: #eee;
    }

    .download {
      display: block;
      text-decoration: none;
      text-align: center;
      background: #0d6efd;
      color: white;
      padding: 16px;
      border-radius: 16px;
      margin-top: 14px;
      font-size: 18px;
      font-weight: bold;
    }

    .note {
      background: #fff3cd;
      color: #664d03;
      padding: 14px;
      border-radius: 14px;
      margin-top: 15px;
      line-height: 1.7;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      padding: 10px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>🎨 AI Image App</h1>
    <p>وێنە دروست بکە یان بە AI دەستکاری بکە</p>
  </div>

  <div class="card">

    <label class="upload" for="imageInput">

      <div class="upload-icon">📷</div>

      <div class="upload-text">
        وێنەیەک هەڵبژێرە
      </div>

      <div class="upload-small">
        بۆ دەستکاریکردنی وێنە
      </div>

    </label>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
    >

    <div id="previewBox">

      <img
        id="previewImage"
        alt="Preview"
      >

      <button
        class="remove-btn"
        onclick="removeImage()"
        title="سڕینەوە"
      >
        ×
      </button>

    </div>

  </div>


  <div class="card">

    <label for="prompt">
      ✍️ داواکارییەکەت بنووسە
    </label>

    <textarea
      id="prompt"
      placeholder="نموونە: جلوبەرگی ئەم کەسە بگۆڕە بۆ جلوبەرگی کوردی، ڕووخسار و شێوەی کەسەکە وەک خۆی بهێڵەوە"
    ></textarea>

  </div>


  <button
    class="generate"
    id="generateBtn"
    onclick="generateImage()"
  >
    ✨ AI Edit / دروستکردنی وێنە
  </button>


  <button
    class="clear"
    onclick="clearAll()"
  >
    🗑️ سڕینەوەی هەموو شتێک
  </button>


  <div id="status"></div>


  <div class="card" id="resultBox">

    <h2>🖼️ ئەنجام</h2>

    <img
      id="resultImage"
      alt="AI Result"
    >

    <a
      id="downloadBtn"
      class="download"
      href="#"
      target="_blank"
    >
      ⬇️ کردنەوەی وێنە
    </a>

  </div>


  <div class="note">
    💡 ئەگەر وێنە Upload نەکەیت، ئەپەکە وێنەی نوێ لەسەر بنەمای دەقەکەت دروست دەکات.
  </div>


  <div class="footer">
    AI Image App © 2026
  </div>

</div>


<script>

let uploadedImageData = null;


/* =========================
   IMAGE UPLOAD
========================= */

document
  .getElementById("imageInput")
  .addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
      showStatus("❌ تکایە تەنها وێنە هەڵبژێرە.", true);
      return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {

      uploadedImageData = e.target.result;

      document.getElementById("previewImage").src =
        uploadedImageData;

      document.getElementById("previewBox").style.display =
        "block";

      hideStatus();

    };

    reader.readAsDataURL(file);

  });


/* =========================
   REMOVE IMAGE
========================= */

function removeImage() {

  uploadedImageData = null;

  document.getElementById("imageInput").value = "";

  document.getElementById("previewImage").src = "";

  document.getElementById("previewBox").style.display =
    "none";
}


/* =========================
   STATUS
========================= */

function showStatus(message, error = false) {

  const status =
    document.getElementById("status");

  status.innerHTML = message;

  status.style.display = "block";

  status.className = error ? "" : "loading";

}


function hideStatus() {

  const status =
    document.getElementById("status");

  status.style.display = "none";

}


/* =========================
   TEXT TO IMAGE
========================= */

function generateFromText(prompt) {

  const encodedPrompt =
    encodeURIComponent(prompt);

  const url =
    "https://image.pollinations.ai/prompt/" +
    encodedPrompt +
    "?width=1024" +
    "&height=1024" +
    "&nologo=true" +
    "&model=flux";

  showResult(url);
}


/* =========================
   GENERATE
========================= */

async function generateImage() {

  const prompt =
    document.getElementById("prompt").value.trim();

  const button =
    document.getElementById("generateBtn");

  if (!prompt) {

    showStatus(
      "❌ تکایە داواکارییەکە بنووسە.",
      true
    );

    return;
  }


  button.disabled = true;

  showStatus(
    "⏳ تکایە چاوەڕێ بکە... AI لەسەر وێنەکەت کار دەکات."
  );


  try {

    /*
      ئەگەر وێنە نەبێت:
      Text → Image
    */

    if (!uploadedImageData) {

      generateFromText(prompt);

      return;
    }


    /*
      Image → Image

      Pollinations supports image-capable models,
      but authenticated API access may be required.
    */

    const response = await fetch(
      "https://gen.pollinations.ai/v1/images/edits",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          model:
            "black-forest-labs/flux.1-kontext-pro",

          prompt: prompt,

          image:
            uploadedImageData

        })

      }
    );


    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        "API Error " +
        response.status +
        ": " +
        errorText
      );
    }


    const data =
      await response.json();


    let imageUrl = null;


    /*
      Try common response formats
    */

    if (data.url) {

      imageUrl = data.url;

    } else if (
      data.data &&
      data.data[0] &&
      data.data[0].url
    ) {

      imageUrl =
        data.data[0].url;

    } else if (
      data.data &&
      data.data[0] &&
      data.data[0].b64_json
    ) {

      imageUrl =
        "data:image/png;base64," +
        data.data[0].b64_json;

    }


    if (!imageUrl) {

      throw new Error(
        "API بە شێوەیەکی نەناسراو وەڵامی دا."
      );
    }


    showResult(imageUrl);

  }

  catch (error) {

    console.error(error);

    showStatus(
      "❌ هەڵەیەک ڕوویدا:<br><br>" +
      "<small>" +
      escapeHtml(error.message) +
      "</small>",
      true
    );

  }

  finally {

    button.disabled = false;

  }

}


/* =========================
   SHOW RESULT
========================= */

function showResult(url) {

  const resultBox =
    document.getElementById("resultBox");

  const resultImage =
    document.getElementById("resultImage");

  const downloadBtn =
    document.getElementById("downloadBtn");


  resultImage.src = url;

  downloadBtn.href = url;

  resultBox.style.display = "block";

  hideStatus();


  resultBox.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

}


/* =========================
   CLEAR
========================= */

function clearAll() {

  uploadedImageData = null;

  document.getElementById("imageInput").value = "";

  document.getElementById("prompt").value = "";

  document.getElementById("previewImage").src = "";

  document.getElementById("previewBox").style.display =
    "none";

  document.getElementById("resultImage").src = "";

  document.getElementById("resultBox").style.display =
    "none";

  hideStatus();

}


/* =========================
   ESCAPE ERROR TEXT
========================= */

function escapeHtml(text) {

  return String(text)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
