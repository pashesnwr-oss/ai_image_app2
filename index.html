<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ai_image_app2</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 18px;
      resize: vertical;
      direction: rtl;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #238636;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    #status {
      text-align: center;
      margin: 20px 0;
      color: #666;
    }

    #result {
      margin-top: 20px;
      text-align: center;
    }

    #result img {
      max-width: 100%;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.15);
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎨 AI Image App</h1>

    <div class="subtitle">
      وێنە دروست بکە بە نووسینی داواکارییەکەت
    </div>

    <textarea
      id="prompt"
      placeholder="نموونە: شارێکی جوان لە شەوی باراناوی، بە شێوازی سینەمایی"
    ></textarea>

    <button id="generateBtn" onclick="generateImage()">
      🎨 دروستکردنی وێنە
    </button>

    <div id="status"></div>

    <div id="result"></div>

  </div>

  <script>
    function generateImage() {

      const prompt = document.getElementById("prompt").value.trim();
      const button = document.getElementById("generateBtn");
      const status = document.getElementById("status");
      const result = document.getElementById("result");

      if (!prompt) {
        status.textContent = "⚠️ تکایە سەرەتا داواکارییەک بنووسە.";
        return;
      }

      button.disabled = true;
      status.textContent = "⏳ وێنەکە لە دروستکردندایە...";
      result.innerHTML = "";

      const imageUrl =
        "https://image.pollinations.ai/prompt/" +
        encodeURIComponent(prompt) +
        "?width=1024&height=1024&nologo=true";

      const image = new Image();

      image.onload = function () {
        result.innerHTML = "";
        result.appendChild(image);

        status.textContent = "✅ وێنەکە ئامادەیە!";
        button.disabled = false;
      };

      image.onerror = function () {
        status.textContent =
          "❌ کێشەیەک ڕوویدا. تکایە دووبارە هەوڵ بدە.";

        button.disabled = false;
      };

      image.src = imageUrl;
    }
  </script>

</body>
</html>
