<!DOCTYPE html><html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image App</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .upload-box {
      background: white;
      border: 2px dashed #bbb;
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .upload-box:hover {
      border-color: #238636;
    }

    .upload-box input {
      display: none;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 450px;
      object-fit: contain;
      margin-top: 15px;
      border-radius: 15px;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 18px;
      resize: vertical;
      direction: rtl;
      margin-bottom: 5px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #238636;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #1b6f2c;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      margin: 20px 0;
      color: #666;
    }

    #result {
      margin-top: 20px;
      text-align: center;
    }

    #result img {
      max-width: 100%;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.15);
    }

    .remove-btn {
      background: #d33;
      margin-top: 10px;
    }

    .remove-btn:hover {
      background: #b22;
    }
  </style></head><body>  <div class="container"><h1>🎨 AI Image App</h1>

<div class="subtitle">
  وێنە دروست بکە یان وێنەیەک بە AI دەستکاری بکە
</div>

<!-- Upload -->
<label class="upload-box">
  📷
  <br><br>
  <strong>وێنەکەت هەڵبژێرە</strong>
  <br>
  <small>کلیک بکە بۆ Upload کردنی وێنە</small>

  <input
    type="file"
    id="imageInput"
    accept="image/*"
    onchange="handleImageUpload(event)"
  >

  <img id="preview" alt="Preview">
</label>

<button
  id="removeBtn"
  class="remove-btn"
  style="display:none;"
  onclick="removeImage()"
>
  🗑️ سڕینەوەی وێنە
</button>

<!-- Prompt -->
<textarea
  id="prompt"
  placeholder="نموونە: جلوبەرگی ئەم کەسە بگۆڕە بۆ جلوبەرگی کوردی، ڕووخسار و شێوەی کەسەکە وەک خۆی بهێڵەوە"
></textarea>

<button id="generateBtn" onclick="generateImage()">
  ✨ AI Edit / دروستکردنی وێنە
</button>

<div id="status"></div>

<div id="result"></div>

  </div>  <script>

    let uploadedImageData = null;

    // ==============================
    // Upload Image
    // ==============================

    function handleImageUpload(event) {

      const file = event.target.files[0];

      if (!file) {
        return;
      }

      if (!file.type.startsWith("image/")) {
        alert("تکایە تەنها فایلێکی وێنە هەڵبژێرە.");
        return;
      }

      const reader = new FileReader();

      reader.onload = function(e) {

        uploadedImageData = e.target.result;

        const preview = document.getElementById("preview");
        const removeBtn = document.getElementById("removeBtn");

        preview.src = uploadedImageData;
        preview.style.display = "block";

        removeBtn.style.display = "block";

      };

      reader.readAsDataURL(file);
    }


    // ==============================
    // Remove Image
    // ==============================

    function removeImage() {

      uploadedImageData = null;

      document.getElementById("imageInput").value = "";
      document.getElementById("preview").style.display = "none";
      document.getElementById("preview").src = "";

      document.getElementById("removeBtn").style.display = "none";
    }


    // ==============================
    // Generate / Edit Image
    // ==============================

    async function generateImage() {

      const prompt =
        document.getElementById("prompt").value.trim();

      const button =
        document.getElementById("generateBtn");

      const status =
        document.getElementById("status");

      const result =
        document.getElementById("result");


      if (!prompt) {

        status.textContent =
          "⚠️ تکایە سەرەتا فرمانەکە بنووسە.";

        return;
      }


      button.disabled = true;

      result.innerHTML = "";

      status.textContent =
        "⏳ AI لەسەر وێنەکە کار دەکات...";


      try {

        // ======================================
        // MODE 1: AI EDIT
        // ======================================

        if (uploadedImageData) {

          const response = await fetch(
            "https://gen.pollinations.ai/v1/images/edits",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({

                model:
                  "black-forest-labs/flux.1-kontext-pro",

                prompt: prompt,

                image: uploadedImageData

              })
            }
          );


          if (!response.ok) {

            throw new Error(
              "AI Edit request failed"
            );
          }


          const data = await response.json();


          let imageUrl = null;


          if (
            data.data &&
            data.data[0]
          ) {

            imageUrl =
              data.data[0].url ||
              (
                data.data[0].b64_json
                  ? "data:image/png;base64," +
                    data.data[0].b64_json
                  : null
              );

          }


          if (!imageUrl) {

            throw new Error(
              "No image returned"
            );
          }


          showResult(imageUrl);

        }

        // ======================================
        // MODE 2: TEXT TO IMAGE
        // ======================================

        else {

          const imageUrl =
            "https://image.pollinations.ai/prompt/" +
            encodeURIComponent(prompt) +
            "?width=1024&height=1024&nologo=true";


          showResult(imageUrl);

        }

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "❌ کێشەیەک ڕوویدا. تکایە دووبارە هەوڵ بدە.";

      }

      finally {

        button.disabled = false;

      }

    }


    // ==============================
    // Show Result
    // ==============================

    function showResult(imageUrl) {

      const status =
        document.getElementById("status");

      const result =
        document.getElementById("result");


      const image =
        new Image();


      image.onload = function() {

        result.innerHTML = "";

        result.appendChild(image);

        status.textContent =
          "✅ وێنەکە ئامادەیە!";

      };


      image.onerror = function() {

        status.textContent =
          "❌ نەتوانرا وێنەکە پیشان بدرێت.";

      };


      image.src = imageUrl;

    }

  </script></body>
</html>
